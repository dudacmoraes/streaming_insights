<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Streaming Insights</title>
    <link rel="icon" type="image/png" href="../img/1301944.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-size: cover;
            color: #ffffff;
            overflow: hidden;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* Container centralizado */
        .login-container {
            background: rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 0 16px;
                padding: 40px 24px;
            }
        }

        /* Logo */
        .logo {
            width: 220px;
            margin-bottom: 24px; /* centraliza a logo e dá espaço inferior */
        }

        /* Título */
        h1 {
            margin: 0 0 32px;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* Formulário */
        form {
            width: 100%;
        }

        /* Campos de texto */
        #username,
        #password {
            width: 75%;
            padding: 10px 36px 10px 4px;
            margin-bottom: 24px;
            background-color: transparent;
            border: none;
            border-bottom: 2px solid white;
            font-family: 'Roboto', sans-serif;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        #username:focus,
        #password:focus {
            border-bottom-color: #6ab0ff;
        }

        #username::placeholder,
        #password::placeholder {
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }

        /* Wrapper do campo senha */
        .password-field {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Botão mostrar senha */
        .eye-btn {
            position: absolute;
            right: calc((100% - 70%) / 2 - 2px);
            top: 35%;
            transform: translateY(-60%);
            width: 25px;
            height: 25px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 50%;
            background: rgba(255, 255, 255, .12);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: background 0.2s ease;
        }

        .eye-btn::before {
            content: "";
            width: 15px;
            height: 15px;
            background: currentColor;
            transition: mask 0.3s ease, -webkit-mask 0.3s ease;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23fff" d="M12 5c4.5 0 8.5 2.9 10 7-1.5 4.1-5.5 7-10 7S3.5 16.1 2 12c1.5-4.1 5.5-7 10-7Zm0 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>') no-repeat center/contain;
            mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%23fff" d="M12 5c4.5 0 8.5 2.9 10 7-1.5 4.1-5.5 7-10 7S3.5 16.1 2 12c1.5-4.1 5.5-7 10-7Zm0 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>') no-repeat center/contain;
        }

        .eye-btn::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 2px;
            background: currentColor;
            border-radius: 2px;
            transform: scaleX(0) rotate(-20deg);
            opacity: 0;
            transition: transform .25s ease, opacity .25s ease;
        }

        .eye-btn.closed::after {
            transform: scaleX(1) rotate(-20deg);
            opacity: 1;
        }

        .eye-btn:hover { background: rgba(255, 255, 255, .22); }

        .eye-btn:focus-visible { outline: 2px solid #6ab0ff; outline-offset: 2px; }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear { display: none; }

        /* Botão Entrar */
        #enter-btn {
            display: block;
            width: 78%;
            padding: 10px;
            margin: 28px auto 0;
            border: 2px solid white;
            border-radius: 20px;
            background-color: transparent;
            color: white;
            font-size: 16px;
            font-family: 'Roboto', sans-serif;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        #enter-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            box-shadow: none;
            filter: grayscale(30%);
        }

        #enter-btn:not(:disabled):hover {
            background-color: white;
            color: black;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        #enter-btn:not(:disabled):active {
            animation: pulse .2s ease-out;
        }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(0.92); }
            100% { transform: scale(1); }
        }

        /* Avião animado no botão */
        #enter-btn::after {
            content: "";
            background-image: url("/painel_360/assets/img/aviao.png");
            background-size: contain;
            background-repeat: no-repeat;
            width: 24px;
            height: 24px;
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            pointer-events: none;
            transition: transform .7s ease, opacity .3s ease;
        }

        #enter-btn.loading::after {
            opacity: 1;
            transform: translate(260px, -50%);
        }

        #enter-btn.loading {
            color: transparent;
        }
    </style>
</head>

<body>
    <div id="vanta-bg"></div>

    <main>
        <div class="login-container">
            <!--<img class="logo" src="../assets/img/1301944.svg" alt="Logo"/> -->
            <h1>Streaming Insights</h1>

            <form action="./index.html" method="post" onsubmit="startAnimation(event)">
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Usuário"
                    required
                    spellcheck="false"
                    autocapitalize="none"
                    autocomplete="username"
                    inputmode="text"
                    minlength="8"
                    maxlength="8">

                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Senha"
                        required
                        autocomplete="current-password"
                        minlength="4">
                    <button
                        type="button"
                        id="toggle-password"
                        class="eye-btn"
                        aria-controls="password"
                        aria-label="Mostrar senha"
                        aria-pressed="false">
                    </button>
                </div>

                <button type="submit" id="enter-btn" disabled>
                    <span class="btn-label">Entrar</span>
                </button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.halo.min.js"></script>

    <script>
        VANTA.HALO({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: false,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1
        })
    </script>

    <script>
        (function () {
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const toggle   = document.getElementById('toggle-password');
            const form     = document.querySelector('form');
            const btn      = document.getElementById('enter-btn');

            // Validação do campo usuário
            const REGEX_FILTER = /[^\p{L}]+/gu;

            username.addEventListener('input', () => {
                const pos      = username.selectionStart;
                const original = username.value;
                const filtered = original.replace(REGEX_FILTER, '');

                if (filtered !== original) {
                    username.value = filtered;
                    username.setSelectionRange(pos - 1, pos - 1);
                }

                btn.disabled = !form.checkValidity();
            });

            // Habilita/desabilita botão
            function updateBtn() {
                btn.disabled = !form.checkValidity();
            }

            form.addEventListener('input', updateBtn);
            updateBtn(); // script no fim do body — DOM já disponível

            // Toggle de visibilidade da senha
            if (password && toggle) {
                toggle.addEventListener('click', () => {
                    const showing = password.type === 'text';
                    password.type = showing ? 'password' : 'text';
                    toggle.classList.toggle('closed', showing);
                    toggle.setAttribute('aria-pressed', String(!showing));
                    toggle.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
                });
            }
        })();

        // Animação do avião ao submeter
        function startAnimation(evento) {
            evento.preventDefault();
            const btn = document.getElementById('enter-btn');

            btn.classList.add('loading');

            setTimeout(() => {
                // form.submit(); // descomentar quando houver backend
                window.location.href = 'index.html';
            }, 800);
        }

        // Limpa o formulário ao carregar e ao voltar via histórico
        (function resetForm() {
            const form = document.querySelector('form');
            const user = document.getElementById('username');
            if (form) form.reset();
            if (user) user.value = '';
        })();

        window.addEventListener('pageshow', (evento) => {
            const form = document.querySelector('form');
            const user = document.getElementById('username');
            form.reset();
            user.value = '';
        });
    </script>
</body>
</html>
