<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  <!-- corrigido: era .0 -->
    <title>Painel 360° - Embraer</title>
    <link rel="icon" type="image/png" href="/Painel 360/HTML/img/EMB_Symbol_white-RGB_1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="header-hero-img">
        <!-- 1. Botão menu -->
        <div id="mobile-menu"
             class="mobile-menu"
             aria-controls="menu"
             aria-expanded="false"
             aria-label="Abrir menu"
             role="button"
             tabindex="0">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>

        <!-- 2. Logo Embraer e título do site -->
        <img class="marca-embraer" src="/Painel 360/HTML/img/EMB_Logo_white_RGB_1.png" alt="Logo Embraer Branca"/>

        <div class="titulo">
            <h1>Painel 360°</h1>
        </div>

        <!-- 3. Espaçador para equilibrar o título visualmente -->
        <div class="header-spacer" aria-hidden="true"></div>
    </header>

    <!-- Menu lateral (fora do header — position: fixed próprio) -->
    <ul id="menu" role="navigation" aria-label="Menu principal">
        <li><a href="/">Exemplo 1</a></li>
        <li><a href="/">Exemplo 2</a></li>
        <li><a href="/">Exemplo 3</a></li>
    </ul>

    <main>
        <div class="conteudo-graficos">
            <div class="grafico-container">
                <h2>Gráfico de linhas</h2>
                <canvas id="graficoLinha"></canvas>
            </div>

            <div class="grafico-container">
                <h2>Gráfico de linhas 2</h2>
                <canvas id="graficoLinha2"></canvas>
            </div>

            <div class="grafico-container">
                <h2>Gráfico de barras</h2>
                <canvas id="graficoBarra"></canvas>
            </div>

            <div class="grafico-container">
                <h2>Gráfico de barras 2</h2>
                <canvas id="graficoBarra2"></canvas>
            </div>
        </div>
    </main>

    <script>
        //Animação dos cards ao carregar
        window.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.grafico-container');

            cards.forEach((card, i) => {
                setTimeout(() => {
                    card.classList.add('animate');
                }, i * 180); //delay entre cada card (efeito "stagger")
            });
        });

        (function () {
            const btn  = document.getElementById('mobile-menu');
            const menu = document.getElementById('menu');
            if (!btn || !menu) return;

            function toggleMenu(forceOpen) {
                const willOpen = typeof forceOpen === 'boolean'
                    ? forceOpen
                    : !menu.classList.contains('open');

                menu.classList.toggle('open', willOpen);
                document.body.classList.toggle('menu-aberto', willOpen);
                btn.setAttribute('aria-expanded', String(willOpen));
                btn.setAttribute('aria-label', willOpen ? 'Fechar menu' : 'Abrir menu');
            }

            btn.addEventListener('click', () => toggleMenu());

            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMenu();
                }
                if (e.key === 'Escape') toggleMenu(false);
            });

            document.addEventListener('click', (e) => {
                if (!btn.contains(e.target) && !menu.contains(e.target)) {
                    toggleMenu(false);
                }
            });
        })();
    </script>

    <script src="/Painel 360/HTML/my_utils/utils.js"></script>
    <script src="/Painel 360/HTML/node_modules/chart.js/dist/chart.umd.min.js"></script>

    <script>
        new Chart(document.getElementById('graficoLinha'), {
            type: 'line',
            data: {
                labels: Utils.months({ count: 7 }),
                datasets: [
                    {
                        label: 'Dataset 1',
                        data: Utils.numbers({ count: 7 }),
                        borderColor: Utils.CHART_COLORS.red,
                        backgroundColor: Utils.transparentize(Utils.CHART_COLORS.red, 0.5),
                        tension: 0.4
                    },
                    {
                        label: 'Dataset 2',
                        data: Utils.numbers({ count: 7 }),
                        borderColor: Utils.CHART_COLORS.blue,
                        backgroundColor: Utils.transparentize(Utils.CHART_COLORS.blue, 0.5),
                        tension: 0.4
                    }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        new Chart(document.getElementById('graficoLinha2'), {
            type: 'line',
            data: {
                labels: Utils.months({ count: 7 }),
                datasets: [
                    {
                        label: 'Dataset 1',
                        data: Utils.numbers({ count: 7 }),
                        borderColor: Utils.CHART_COLORS.yellow,
                        backgroundColor: Utils.transparentize(Utils.CHART_COLORS.yellow, 0.5),
                        tension: 0.1
                    },
                    {
                        label: 'Dataset 2',
                        data: Utils.numbers({ count: 7 }),
                        borderColor: Utils.CHART_COLORS.blue,
                        backgroundColor: Utils.transparentize(Utils.CHART_COLORS.blue, 0.5),
                        tension: 0.1
                    }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        new Chart(document.getElementById('graficoBarra'), {
            type: 'bar',
            data: {
                labels: Utils.months({ count: 6 }),
                datasets: [{
                    label: 'Dataset 1',
                    data: Utils.numbers({ count: 6 }),
                    borderColor: Utils.CHART_COLORS.purple,
                    backgroundColor: Utils.transparentize(Utils.CHART_COLORS.purple, 0.5),
                    borderWidth: 1
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        new Chart(document.getElementById('graficoBarra2'), {
            type: 'bar',
            data: {
                labels: Utils.months({ count: 7 }), /* corrigido: count uniforme em todos os datasets */
                datasets: [
                    {
                        label: 'Dataset 1',
                        data: Utils.numbers({ count: 7 }),
                        backgroundColor: Utils.CHART_COLORS.red
                    },
                    {
                        label: 'Dataset 2',
                        data: Utils.numbers({ count: 7 }),
                        backgroundColor: Utils.CHART_COLORS.green
                    },
                    {
                        label: 'Dataset 3',
                        data: Utils.numbers({ count: 7 }),
                        backgroundColor: Utils.CHART_COLORS.orange
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false },
                scales: {
                    x: { stacked: true },
                    y: { stacked: true }
                }
            }
        });
    </script>
</body>
</html>
