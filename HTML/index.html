<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/painel_360/css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />

</head>

<body>
    <header class="header-hero-img">

        <!-- 1. Botão menu -->
        <div id="mobile-menu"
             class="mobile-menu"
             aria-controls="menu"
             aria-expanded="false"
             aria-label="Abrir menu"
             role="button"
             tabindex="0">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>

        <!-- 2. Logo Embraer e título do site -->
        <img class="marca-embraer" src="/painel_360/assets/img/EMB_Logo_white_RGB_1.png" alt="Logo Embraer Branca"/>

        <div class="titulo">
            <h1>Painel 360°</h1>
        </div>

        <!-- 3. Espaçador para equilibrar o título visualmente -->
        <div class="header-spacer" aria-hidden="true"></div>
        
    </header>

    <!-- Menu lateral (fora do header — position: fixed próprio) -->
    <nav id="menu" role="navigation" aria-label="Menu principal">
        <li><a href="/">Exemplo 1</a></li>
        <li><a href="/">Exemplo 2</a></li>
        <li><a href="/">Exemplo 3</a></li>
    </nav>

    <main>
        <div class="busca">
            <form action="/buscar" method="get">
                <input type="search" name="busca" placeholder="Pesquisa" aria-label="Pesquisar">
                <button type="submit">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </form>
        </div>

        <div class="conteudo-graficos">
            <div class="grafico-container">
                <h2>Gráfico de linhas</h2>
                <canvas id="graficoLinha"></canvas>
            </div>

            <div class="grafico-container">
                <h2>Gráfico de linhas 2</h2>
                <canvas id="graficoLinha2"></canvas>
            </div>

            <div class="grafico-container">
                <h2>Gráfico de barras</h2>
                <canvas id="graficoBarra"></canvas>
            </div>

            <div class="grafico-container">
                <h2>Gráfico de barras 2</h2>
                <canvas id="graficoBarra2"></canvas>
            </div>
        </div>

        <div class="conteudo-tabela">
            <h2>Tabela</h2>
            <div id="tabela-grid"></div>
        </div>
    </main>

    <script>
        async function buscarDados() {
            const response = await fetch("http://127.0.0.1:8000/dados");
            if (!response.ok) {
                throw new Error("Erro ao buscar dados da API");
            }
            return await response.json();
        }
    </script>

    <script>
        //Animação dos cards ao carregar
        window.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.grafico-container');

            cards.forEach((card, i) => {
                setTimeout(() => {
                    card.classList.add('animate');
                }, i * 180); //delay entre cada card (efeito "stagger")
            });
        });

        (function () {
            const btn  = document.getElementById('mobile-menu');
            const menu = document.getElementById('menu');
            if (!btn || !menu) return;

            function toggleMenu(forceOpen) {
                const willOpen = typeof forceOpen === 'boolean'
                    ? forceOpen
                    : !menu.classList.contains('open');

                menu.classList.toggle('open', willOpen);
                document.body.classList.toggle('menu-aberto', willOpen);
                btn.setAttribute('aria-expanded', String(willOpen));
                btn.setAttribute('aria-label', willOpen ? 'Fechar menu' : 'Abrir menu');
            }

            btn.addEventListener('click', () => toggleMenu());

            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleMenu();
                }
                if (e.key === 'Escape') toggleMenu(false);
            });

            document.addEventListener('click', (e) => {
                if (!btn.contains(e.target) && !menu.contains(e.target)) {
                    toggleMenu(false);
                }
            });
        })();
    </script>

    <script src="/painel_360/my_utils/utils.js"></script>
    <script src="/painel_360/node_modules/chart.js/dist/chart.umd.min.js"></script>

    <script>
        buscarDados().then(dados => {
            const labels = dados.map(d => d.mes);
            const valores = dados.map(d => Number(d.valor));
        })

        new Chart(document.getElementById('graficoLinha'), {

        new Chart(document.getElementById('graficoLinha2'), {

        new Chart(document.getElementById('graficoBarra'), {

                datasets: [{

        new Chart(document.getElementById('graficoBarra2'), {
            type: 'bar',
            data: {
                labels: Utils.months({ count: 7 }), /* corrigido: count uniforme em todos os datasets */
                datasets: [
                    {
                        label: 'Dataset 1',
                        data: Utils.numbers({ count: 7 }),
                        backgroundColor: Utils.CHART_COLORS.red
                    },
                    {
                        label: 'Dataset 2',
                        data: Utils.numbers({ count: 7 }),
                        backgroundColor: Utils.CHART_COLORS.green
                    },
                    {
                        label: 'Dataset 3',
                        data: Utils.numbers({ count: 7 }),
                        backgroundColor: Utils.CHART_COLORS.orange
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false },
                scales: {
                    x: { stacked: true },
                    y: { stacked: true }
                }
            }
        });
    </script>

    <script src="/painel_360/node_modules/gridjs/dist/gridjs.umd.js"></script>

    <script>
        buscarDados().then(dados => {
            console.log("Dados recebidos da API:", dados);

            const colunas = Object.keys(dados[0])

            function normalizarChave(col) {
                return col
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '');
            }
        
            new gridjs.Grid({
                columns: colunas.map(col => {
                    const chaveNormalizada = normalizarChave(col);

                    return {
                        id: col,
                        name: headerMap[chaveNormalizada] ?? col
                    };
                }),

                data: dados.map(row =>
                    colunas.map(col => row[col])
                ),

                search: true,
                sort: true,
                pagination: {limit: 5}
            }).render(document.getElementById("tabela-grid"));
        })
    </script>

</body>
