<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Test</title>
    <link rel="stylesheet" href="/painel_360/node_modules/gridjs/dist/theme/mermaid.min.css">
</head>

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    body {
        font-family: 'Roboto', sans-serif;
        background-size: cover;
        color: #fff;
    }

    .conteudo-tabela {
        margin-top: 30px;
        background-color: rgba(0, 0, 0, 0.8);
        padding: 30px;
        border-radius: 10px;
    }

    .conteudo-tabela h2 {
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

</style>

<body>
    <div class="conteudo-tabela">
            <h2>Tabela</h2>
            <div id="tabela-grid"></div>
        </div>
    
    <script>
        async function buscarDados() {
            const response = await fetch("http://127.0.0.1:8000/dados");
            if (!response.ok) {
                throw new Error("Erro ao buscar dados da API");
            }
            return await response.json();
        }
    </script>

    <script src="/painel_360/node_modules/gridjs/dist/gridjs.umd.js"></script>

    <script>
        buscarDados().then(dados => {
            console.log("Dados recebidos da API:", dados);
        
            new gridjs.Grid({
                columns: Object.keys(dados[0]),
                data: dados.map(obj => Object.values(obj)),
                search: true,
                sort: true,
                pagination: { limit: 5 }
            }).render(document.getElementById("tabela-grid"));
        }).catch(erro => console.error(erro))
    </script>
</body>
</html>
